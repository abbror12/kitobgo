# dev branch'ga push -> Docker image GHCR'ga -> serverda compose orqali yangilash.
#
# Kerakli GitHub Secrets (repo Settings -> Secrets and variables -> Actions):
#   SERVER_HOST     — server IP yoki domen
#   SERVER_USER     — SSH foydalanuvchi (masalan: root yoki deploy)
#   SERVER_SSH_KEY  — SSH private key (ed25519 tavsiya; ochiq juftligi serverda
#                     ~/.ssh/authorized_keys ichida bo'lishi kerak)
#   SERVER_PORT     — SSH port (ixtiyoriy, default 22)
#
# Serverda oldindan tayyor bo'lishi kerak: Docker + /opt/kitobgo papkasida
# to'ldirilgan .env va Firebase kaliti. Compose hamda ops/ har deployda ko'chiriladi.
name: Deploy (dev)

on:
  push:
    branches: [dev]

# Bir vaqtda bitta deploy — ketma-ket pushlarda eskisi bekor bo'ladi.
concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kitobgo
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - "5433:5432"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test
        run: ./gradlew test --no-daemon

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: GHCR'ga login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/abbror12/kitobgo:dev
            ghcr.io/abbror12/kitobgo:dev-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Serverda git repository yo'q. Maxfiy bo'lmagan deploy konfiguratsiyasi har safar
      # GitHub'dan nusxalanadi; mavjud .env va firebase-service-account.json tegilmaydi.
      - name: Compose va monitoring konfiguratsiyasini serverga nusxalash
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "docker-compose.prod.yaml,ops"
          target: "/opt/kitobgo"
          overwrite: true

      - name: Serverda yangilash
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # Kalit passphrase bilan qulflangan bo'lsa shu secret ham kerak; parolsiz kalitda bo'sh qoladi.
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd /opt/kitobgo
            docker compose -f docker-compose.prod.yaml pull app prometheus grafana
            docker compose -f docker-compose.prod.yaml up -d
            docker image prune -f
