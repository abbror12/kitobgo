spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/kitobgo
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Sxemani endi Liquibase boshqaradi (db/changelog). Hibernate faqat entity'lar
      # bazaga mosligini tekshiradi — nomuvofiqlik bo'lsa dastur ishga tushmaydi.
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
#    properties:
#      hibernate:
#        format_sql: true
  servlet:
    multipart:
      max-file-size: 5MB        # bitta faylning maksimal hajmi
      max-request-size: 25MB    # bitta so'rovdagi barcha fayllar yig'indisi

springdoc:
  swagger-ui:
    path: /swagger-ui.html          # Swagger UI manzili
    operations-sorter: method       # endpointlarni HTTP metod bo'yicha tartiblash
    tags-sorter: alpha              # teglarni alifbo bo'yicha
  api-docs:
    path: /v3/api-docs              # OpenAPI JSON manzili

app:
  upload:
    dir: ${UPLOAD_DIR:uploads}   # yuklangan fayllar saqlanadigan papka
  jwt:
    # Ishlab chiqarishda (production) bu qiymatni environment variable orqali bering!
    secret: ${JWT_SECRET:kitobgo-super-secret-key-change-in-production-min-32-chars}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # access token — 24 soat
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:2592000000}   # refresh token — 30 kun
  admin:
    phone: ${ADMIN_PHONE:+998900000000}
    password: ${ADMIN_PASSWORD:admin123}
    name: ${ADMIN_NAME:Super Admin}
  fcm:
    # Firebase service account JSON kaliti yo'li (Firebase Console -> Project Settings ->
    # Service accounts -> Generate new private key). Fayl topilmasa push o'chirilgan
    # holda ishlayveradi. Production'da env orqali bering, git'ga qo'ymang!
    service-account: ${FCM_SERVICE_ACCOUNT:firebase-service-account.json}
