# Server (production/staging) compose — Postgres + MinIO + dastur.
#
# Serverda birinchi o'rnatish:
#   1. /opt/kitobgo papkasiga shu fayl + .env qo'yiladi (.env.example asosida;
#      DB_URL=jdbc:postgresql://postgres:5432/kitobgo, S3_ENDPOINT=http://minio:9000,
#      S3_PUBLIC_URL=http://<server-ip>:9000/kitobgo bo'lishi kerak!)
#   2. docker compose -f docker-compose.prod.yaml up -d
# Keyingi deploylar GitHub Actions orqali avtomatik (dev branch'ga push).
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: kitobgo
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD .env da berilishi shart}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d kitobgo"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # rasm URL'lari shu port orqali ochiq (S3_PUBLIC_URL)
      - "9001:9001"   # veb-konsol — kerak bo'lmasa yopib qo'ying
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY .env da berilishi shart}
    volumes:
      - minio-data:/data

  app:
    image: ghcr.io/abbror12/kitobgo:dev
    restart: unless-stopped
    env_file: .env
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

volumes:
  pgdata:
  minio-data:
