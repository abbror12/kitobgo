# Server (production/staging) compose — MinIO + dastur.
# Postgres compose'da YO'Q — mavjud (tashqi) Postgres server ishlatiladi,
# ulanish .env dagi DB_URL orqali:
#   - alohida DB serveri:            jdbc:postgresql://<db-host>:5432/kitobgo
#   - shu servening o'zida (docker'siz o'rnatilgan):
#                                    jdbc:postgresql://host.docker.internal:5432/kitobgo
#
# Serverda birinchi o'rnatish:
#   1. /opt/kitobgo papkasiga shu fayl + ops/ + .env qo'yiladi (.env.example asosida;
#      S3_ENDPOINT=http://minio:9000,
#      S3_PUBLIC_URL=http://<server-ip>:9000/kitobgo bo'lishi kerak!)
#   2. Postgres'da kitobgo bazasi yaratilgan bo'lsin (sxemani Liquibase o'zi quradi)
#   3. GRAFANA_ADMIN_PASSWORD ham .env ichida beriladi
#   4. docker compose -f docker-compose.prod.yaml up -d
# Keyingi deploylar GitHub Actions orqali avtomatik (dev branch'ga push).
services:
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    # Faqat localhost — tashqariga nginx xizmat qiladi (https://kitobgo.com/files/ -> minio).
    # Konsol (9001) kerak bo'lsa SSH tunnel: ssh -L 9001:127.0.0.1:9001 user@server
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY .env da berilishi shart}
    volumes:
      - minio-data:/data

  app:
    image: ghcr.io/abbror12/kitobgo:dev
    restart: unless-stopped
    env_file: .env
    # Faqat localhost — tashqariga nginx (80/443) xizmat qiladi.
    ports:
      - "127.0.0.1:8080:8080"
    # FCM push kaliti. Fayl image ichiga kirmaydi (.dockerignore'da, maxfiy),
    # shuning uchun serverdan mount qilinadi. /opt/kitobgo/firebase-service-account.json
    # OLDINDAN yaratilgan bo'lishi shart — aks holda Docker o'sha yo'lda bo'sh
    # papka yaratadi va FCM ishlamaydi.
    volumes:
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro
    # Konteyner ichidan server (host) mashinasidagi Postgres'ga chiqish uchun —
    # DB_URL'da host.docker.internal ishlatilsa shu kerak (Linux'da).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      minio:
        condition: service_started

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    # Monitoring porti tashqariga ochilmaydi; kerak bo'lsa SSH tunnel ishlatiladi.
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - app

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD .env da berilishi shart}
    # Serverda 3000 band bo'lishi mumkinligi sababli default host port 3001.
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  minio-data:
  prometheus-data:
  grafana-data:
