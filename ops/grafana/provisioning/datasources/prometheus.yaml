apiVersion: 1

# Avvalgi deploy UID bermagan va Grafana uni o'zi yaratgan. Yangi doimiy UID'ga
# xavfsiz o'tish uchun eski nomdagi datasource avval o'chirilib, keyin qayta yaratiladi.
deleteDatasources:
  - name: Prometheus
    orgId: 1

prune: true

datasources:
  - name: Prometheus
    uid: prometheus
    orgId: 1
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    version: 2
